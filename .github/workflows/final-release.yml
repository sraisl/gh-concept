name: final-release

on:
  workflow_dispatch:
    inputs:
      rc_tag:
        description: Published and tested RC to promote (e.g. v0.1.0-rc.6)
        required: true
        type: string

permissions: {}

concurrency:
  group: version-stage
  cancel-in-progress: false
  queue: max

jobs:
  promote:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      packages: write
    env:
      RC_TAG: ${{ inputs.rc_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate selected RC commit
        run: |
          set -euo pipefail
          [[ "${RC_TAG}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-rc\.[1-9][0-9]*$ ]]
          revision=$(git rev-parse "refs/tags/${RC_TAG}^{commit}")
          git merge-base --is-ancestor "${revision}" origin/stage
          echo "REVISION=${revision}" >> "${GITHUB_ENV}"
      - name: Promote verified image and publish final release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/release.py promote-final
