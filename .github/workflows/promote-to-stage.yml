name: promote-to-stage

# Opens one PR per commit pushed to main: promote/<short-sha> → stage.
# Uses a PAT (PROMOTE_TOKEN) instead of GITHUB_TOKEN, because PRs created with
# GITHUB_TOKEN do not trigger pull_request workflows (and thus no required checks).

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: promote-${{ github.sha }}
  cancel-in-progress: false

jobs:
  open-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Create promote branch and PR
        env:
          GH_TOKEN: ${{ secrets.PROMOTE_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          SERVER_URL: ${{ github.server_url }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          COMMIT_AUTHOR: ${{ github.event.head_commit.author.name }}
          BASE: stage
        run: |
          set -euo pipefail

          if [ -z "${GH_TOKEN}" ]; then
            echo "::error::Secret PROMOTE_TOKEN is not set"
            exit 1
          fi

          short="${SHA::7}"
          branch="promote/${short}"

          # Create stage from main on first run.
          if ! gh api "repos/${REPO}/branches/${BASE}" --silent 2>/dev/null; then
            echo "Branch ${BASE} missing, creating it at ${SHA}"
            gh api "repos/${REPO}/git/refs" -f ref="refs/heads/${BASE}" -f sha="${SHA}" --silent
            exit 0
          fi

          # Nothing to promote if stage already contains this commit.
          ahead=$(gh api "repos/${REPO}/compare/${BASE}...${SHA}" --jq .ahead_by)
          if [ "${ahead}" = "0" ]; then
            echo "${BASE} already contains ${short}, skipping"
            exit 0
          fi

          if ! gh api "repos/${REPO}/branches/${branch}" --silent 2>/dev/null; then
            gh api "repos/${REPO}/git/refs" -f ref="refs/heads/${branch}" -f sha="${SHA}" --silent
          fi

          existing=$(gh pr list --repo "${REPO}" --base "${BASE}" --head "${branch}" --state open --json number --jq '.[0].number // empty')
          if [ -n "${existing}" ]; then
            echo "PR #${existing} already open for ${branch}"
            exit 0
          fi

          subject="${COMMIT_MSG%%$'\n'*}"
          # shellcheck disable=SC2016 # backticks are Markdown, not command substitution
          body=$(printf 'Automatic promotion of %s/%s/commit/%s to `%s`.\n\n**Author:** %s\n\n```\n%s\n```\n' \
            "${SERVER_URL}" "${REPO}" "${SHA}" "${BASE}" "${COMMIT_AUTHOR}" "${COMMIT_MSG}")

          # Carry over the semver:* label from the PR that brought this commit into main.
          label=$(gh api "repos/${REPO}/commits/${SHA}/pulls" \
            --jq '[.[].labels[].name | select(startswith("semver:"))][0] // empty')
          if [ -z "${label}" ]; then
            body+=$'\n> [!IMPORTANT]\n> No `semver:*` label found on the source PR — set one before merging.\n'
          fi

          gh pr create --repo "${REPO}" \
            --base "${BASE}" \
            --head "${branch}" \
            --title "Promote ${short}: ${subject}" \
            --body "${body}" \
            ${label:+--label "${label}"}
