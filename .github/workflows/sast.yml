name: sast

# SAST for feature pushes and PRs. The job name "polyscan" is the
# required check name in both branch rulesets (see README).

on:
  push:
    branches-ignore: [stage, promote/stage]
  pull_request:
    branches: [main, stage]

permissions:
  contents: read

concurrency:
  group: sast-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  polyscan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: sraisl/polyscan-action@dc8a1ea115d2dec570301f18ec929350a5b41145 # v16.1.0
        with:
          engines: semgrep,gosec,gitleaks,zizmor,hadolint
          gate: "true"
          max-critical: "0"
          max-high: "0"
          sarif: "true"
