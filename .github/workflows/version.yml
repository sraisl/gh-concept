name: version

# On merge of a promotion PR into stage: derive the bump from its semver:*
# label, prepare a draft and publish it only after the tested image is ready.

on:
  pull_request:
    types: [closed]
    branches: [stage]

permissions: {}

concurrency:
  group: version-stage
  cancel-in-progress: false
  queue: max

jobs:
  tag:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.rc.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false
          sparse-checkout: |
            .github/scripts
            scripts
      - name: Prepare release candidate draft
        id: rc
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.event.pull_request.merge_commit_sha }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: python3 scripts/release.py prepare-rc

  image:
    needs: tag
    if: needs.tag.outputs.tag != ''
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/image.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}
