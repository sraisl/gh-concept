name: image

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Existing RC tag to publish or verify
        required: true
        type: string

permissions: {}

concurrency:
  group: image-${{ inputs.tag }}
  cancel-in-progress: false
  queue: max

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      packages: write
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release commit
        run: |
          set -euo pipefail
          [[ "${TAG}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-rc\.[1-9][0-9]*$ ]]
          revision=$(git rev-parse HEAD)
          test "$(git rev-parse "refs/tags/${TAG}^{commit}")" = "${revision}"
          git merge-base --is-ancestor "${revision}" origin/stage
          echo "REVISION=${revision}" >> "${GITHUB_ENV}"
      - name: Check existing image
        id: existing
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/image-state.py
      - name: Build and test release image
        if: steps.existing.outputs.exists == 'false'
        env:
          IMAGE_NAME: ${{ steps.existing.outputs.image }}
          IMAGE_VERSION: ${{ env.TAG }}
          IMAGE_REVISION: ${{ env.REVISION }}
          IMAGE_SOURCE: ${{ github.server_url }}/${{ github.repository }}
        run: bash scripts/test-container.sh
      - name: Log in to GHCR
        if: steps.existing.outputs.exists == 'false'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "${GHCR_TOKEN}" | docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin
      - name: Publish tested image
        if: steps.existing.outputs.exists == 'false'
        env:
          IMAGE: ${{ steps.existing.outputs.image }}
        run: docker push "${IMAGE}"
      - name: Verify published image
        id: published
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/image-state.py
          grep -qx 'exists=true' "${GITHUB_OUTPUT}"
      - name: Record immutable image reference
        env:
          IMAGE: ${{ steps.published.outputs.image }}
          DIGEST: ${{ steps.published.outputs.digest }}
        run: |
          {
            echo "### Container image"
            echo "Image: \`${IMAGE}\`"
            echo "Commit: \`${REVISION}\`"
            echo "Digest reference: \`${IMAGE%:*}@${DIGEST}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
      - name: Publish ready RC release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/release.py complete-rc
      - name: Log out of GHCR
        if: always()
        run: docker logout ghcr.io
